<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多功能應用程式</title>
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  
  body {
    background-color: var(--bg-primary);
    color: var(--text-light);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .app-container {
    width: 100%;
    max-width: 420px;
    background: var(--bg-secondary);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    position: relative;
    min-height: 680px;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  /* Header Bar */
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    position: relative;
    z-index: 10;
  }

  .nav-tabs {
    display: flex;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    padding: 4px;
    border-radius: 12px;
  }

  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tab-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* 大圓形銷毀按鈕 ☢️ */
  .destruct-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #dc2626, #991b1b);
    border: 2px solid #fca5a5;
    color: #ffffff;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    user-select: none;
  }

  .destruct-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(220, 38, 38, 0.6);
  }

  .destruct-btn:active {
    transform: scale(0.95);
  }

  /* 解鎖畫面 */
  .lock-screen {
    position: absolute;
    inset: 0;
    background: var(--bg-primary);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .pin-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .pin-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .pin-dots {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
  }

  .pin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    transition: background 0.2s;
  }

  .pin-dot.filled {
    background: var(--accent);
  }

  .pin-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: 260px;
  }

  .key-btn {
    aspect-ratio: 1;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-light);
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .key-btn:active {
    background: rgba(255, 255, 255, 0.2);
  }

  /* 頁面切換 */
  .view-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .page-view {
    display: none;
    flex-direction: column;
    height: 100%;
    width: 100%;
  }

  .page-view.active {
    display: flex;
  }

  /* 計算機樣式 */
  .calc-container {
    padding: 20px;
    display: flex;
    flex-direction: column;
    height: 100%;
    justify-content: flex-end;
  }

  .calc-display {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 16px;
    padding: 20px;
    text-align: right;
    margin-bottom: 20px;
    word-break: break-all;
  }

  .calc-history {
    font-size: 14px;
    color: var(--text-muted);
    min-height: 20px;
    margin-bottom: 6px;
  }

  .calc-result {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #ffffff;
  }

  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .calc-btn {
    padding: 18px 0;
    border-radius: 16px;
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .calc-btn:active {
    background: rgba(255, 255, 255, 0.2);
  }

  .calc-btn.op {
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
  }

  .calc-btn.eq {
    background: var(--accent);
    color: #fff;
  }

  .calc-btn.clear {
    background: rgba(239, 68, 68, 0.2);
    color: #f87171;
  }

  /* 聊天室與轉圈圈動畫 */
  .chat-loading {
    position: absolute;
    inset: 0;
    background: var(--bg-secondary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    gap: 16px;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-left-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 15px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .chat-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 16px;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-right: 4px;
    margin-bottom: 12px;
  }

  .chat-bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
  }

  .chat-bubble.sent {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .chat-bubble.received {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-light);
    border-bottom-left-radius: 4px;
  }

  .chat-input-area {
    display: flex;
    gap: 8px;
  }

  .chat-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 10px 14px;
    color: white;
    outline: none;
    font-size: 14px;
  }

  .chat-send-btn {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 16px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="app-container">

  <!-- 解鎖畫面 -->
  <div id="lockScreen" class="lock-screen">
    <div class="pin-title">請輸入解鎖短碼</div>
    <div class="pin-sub">預設短碼：114514</div>
    <div class="pin-dots">
      <div class="pin-dot" id="dot0"></div>
      <div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div>
      <div class="pin-dot" id="dot3"></div>
      <div class="pin-dot" id="dot4"></div>
      <div class="pin-dot" id="dot5"></div>
    </div>
    <div class="pin-keypad">
      <button class="key-btn" onclick="pressPin('1')">1</button>
      <button class="key-btn" onclick="pressPin('2')">2</button>
      <button class="key-btn" onclick="pressPin('3')">3</button>
      <button class="key-btn" onclick="pressPin('4')">4</button>
      <button class="key-btn" onclick="pressPin('5')">5</button>
      <button class="key-btn" onclick="pressPin('6')">6</button>
      <button class="key-btn" onclick="pressPin('7')">7</button>
      <button class="key-btn" onclick="pressPin('8')">8</button>
      <button class="key-btn" onclick="pressPin('9')">9</button>
      <button class="key-btn" onclick="clearPin()">C</button>
      <button class="key-btn" onclick="pressPin('0')">0</button>
      <button class="key-btn" onclick="backspacePin()">⌫</button>
    </div>
  </div>

  <!-- 頂部列 -->
  <div class="header-bar">
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabCalc" onclick="switchTab('calc')">計算機</button>
      <button class="tab-btn" id="tabChat" onclick="switchTab('chat')">聊天室</button>
    </div>
    
    <!-- 大號圓形銷毀按鈕（無提示，直接銷毀） -->
    <button class="destruct-btn" onclick="selfDestruct()" title="銷毀">☢️</button>
  </div>

  <div class="view-content">
    
    <!-- 計算機頁面 -->
    <div class="page-view active" id="calcView">
      <div class="calc-container">
        <div class="calc-display">
          <div class="calc-history" id="calcHistory"></div>
          <div class="calc-result" id="calcResult">0</div>
        </div>
        <div class="calc-grid">
          <button class="calc-btn clear" onclick="calcClear()">C</button>
          <button class="calc-btn op" onclick="calcInput('(')">(</button>
          <button class="calc-btn op" onclick="calcInput(')')">)</button>
          <button class="calc-btn op" onclick="calcInput('/')">÷</button>

          <button class="calc-btn" onclick="calcInput('7')">7</button>
          <button class="calc-btn" onclick="calcInput('8')">8</button>
          <button class="calc-btn" onclick="calcInput('9')">9</button>
          <button class="calc-btn op" onclick="calcInput('*')">×</button>

          <button class="calc-btn" onclick="calcInput('4')">4</button>
          <button class="calc-btn" onclick="calcInput('5')">5</button>
          <button class="calc-btn" onclick="calcInput('6')">6</button>
          <button class="calc-btn op" onclick="calcInput('-')">-</button>

          <button class="calc-btn" onclick="calcInput('1')">1</button>
          <button class="calc-btn" onclick="calcInput('2')">2</button>
          <button class="calc-btn" onclick="calcInput('3')">3</button>
          <button class="calc-btn op" onclick="calcInput('+')">+</button>

          <button class="calc-btn" onclick="calcInput('0')">0</button>
          <button class="calc-btn" onclick="calcInput('.')">.</button>
          <button class="calc-btn clear" onclick="calcBackspace()">⌫</button>
          <button class="calc-btn eq" onclick="calcEquals()">=</button>
        </div>
      </div>
    </div>

    <!-- 聊天室頁面 -->
    <div class="page-view" id="chatView">
      <!-- 加載中與轉圈圈 -->
      <div class="chat-loading" id="chatLoading">
        <div class="spinner"></div>
        <div class="loading-text">加載中...</div>
      </div>

      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-bubble received">歡迎來到加密聊天室！</div>
        </div>
        <div class="chat-input-area">
          <input type="text" class="chat-input" id="chatInput" placeholder="輸入訊息..." onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="chat-send-btn" onclick="sendMessage()">發送</button>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
  // 解鎖短碼改為 114514
  const PASS_CODE = "114514";
  let currentPin = "";

  function pressPin(num) {
    if (currentPin.length < 6) {
      currentPin += num;
      updatePinDots();
      if (currentPin.length === 6) {
        setTimeout(checkPin, 100);
      }
    }
  }

  function clearPin() {
    currentPin = "";
    updatePinDots();
  }

  function backspacePin() {
    currentPin = currentPin.slice(0, -1);
    updatePinDots();
  }

  function updatePinDots() {
    for (let i = 0; i < 6; i++) {
      const dot = document.getElementById(`dot${i}`);
      if (i < currentPin.length) {
        dot.classList.add('filled');
      } else {
        dot.classList.remove('filled');
      }
    }
  }

  function checkPin() {
    if (currentPin === PASS_CODE) {
      document.getElementById('lockScreen').style.display = 'none';
    } else {
      alert("解鎖短碼錯誤！");
      clearPin();
    }
  }

  // 頁面切換與聊天室加載動畫
  let chatLoaded = false;
  function switchTab(tab) {
    document.getElementById('tabCalc').classList.toggle('active', tab === 'calc');
    document.getElementById('tabChat').classList.toggle('active', tab === 'chat');
    document.getElementById('calcView').classList.toggle('active', tab === 'calc');
    document.getElementById('chatView').classList.toggle('active', tab === 'chat');

    if (tab === 'chat' && !chatLoaded) {
      const loadingEl = document.getElementById('chatLoading');
      loadingEl.style.display = 'flex';
      setTimeout(() => {
        loadingEl.style.display = 'none';
        chatLoaded = true;
      }, 1200); // 模擬加載 1.2 秒
    }
  }

  // 計算機邏輯：超過15位數轉科學記號
  let calcExpr = "";
  
  function calcInput(char) {
    const resEl = document.getElementById('calcResult');
    if (resEl.innerText === "0" || resEl.innerText === "Error") {
      if (!isNaN(char) || char === '(' || char === '.') {
        calcExpr = char;
      } else {
        calcExpr += char;
      }
    } else {
      calcExpr += char;
    }
    document.getElementById('calcResult').innerText = calcExpr;
  }

  function calcClear() {
    calcExpr = "";
    document.getElementById('calcHistory').innerText = "";
    document.getElementById('calcResult').innerText = "0";
  }

  function calcBackspace() {
    calcExpr = calcExpr.slice(0, -1);
    document.getElementById('calcResult').innerText = calcExpr || "0";
  }

  function formatCalcResult(value) {
    if (typeof value !== 'number' || isNaN(value)) return "Error";
    if (!isFinite(value)) return "Infinity";

    let str = value.toString();
    // 取得純數字位數長度
    let cleanDigits = str.replace(/[^0-9]/g, '');

    // 超過 15 位數，或極大/極小數值，使用科學記號表示
    if (cleanDigits.length > 15 || Math.abs(value) >= 1e15 || (Math.abs(value) < 1e-15 && value !== 0)) {
      return value.toExponential(8);
    }
    return str;
  }

  function calcEquals() {
    try {
      document.getElementById('calcHistory').innerText = calcExpr + " =";
      let evalResult = Function('"use strict"; return (' + calcExpr + ')')();
      let formatted = formatCalcResult(evalResult);
      document.getElementById('calcResult').innerText = formatted;
      calcExpr = formatted;
    } catch (e) {
      document.getElementById('calcResult').innerText = "Error";
      calcExpr = "";
    }
  }

  // 聊天室傳送訊息
  function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;

    const chatMsgs = document.getElementById('chatMessages');
    
    const userBubble = document.createElement('div');
    userBubble.className = 'chat-bubble sent';
    userBubble.innerText = msg;
    chatMsgs.appendChild(userBubble);

    input.value = "";
    chatMsgs.scrollTop = chatMsgs.scrollHeight;

    setTimeout(() => {
      const botBubble = document.createElement('div');
      botBubble.className = 'chat-bubble received';
      botBubble.innerText = "已接收您的加密訊息。";
      chatMsgs.appendChild(botBubble);
      chatMsgs.scrollTop = chatMsgs.scrollHeight;
    }, 800);
  }

  // 無提示銷毀按鈕功能（直接執行）
  function selfDestruct() {
    // 清空計算機與聊天紀錄
    calcClear();
    document.getElementById('chatMessages').innerHTML = '<div class="chat-bubble received">歡迎來到加密聊天室！</div>';
    chatLoaded = false;

    // 立即重設並進入鎖定畫面
    currentPin = "";
    updatePinDots();
    document.getElementById('lockScreen').style.display = 'flex';
  }
</script>

</body>
</html>
