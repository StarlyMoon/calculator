<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計算機</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #app-container {
            width: 360px;
            height: 640px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* --- 計算機介面 --- */
        #calculator-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #222;
        }
        #calc-display {
            flex: 1;
            background: #111;
            color: white;
            font-size: 36px;
            text-align: right;
            padding: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            word-wrap: break-word;
            word-break: break-all;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #444;
        }
        .calc-btn {
            background: #333;
            color: white;
            font-size: 24px;
            border: none;
            padding: 22px 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calc-btn:active {
            background: #555;
        }
        .calc-btn.op {
            background: #f39c12;
        }
        .calc-btn.op:active {
            background: #d68910;
        }
        .calc-btn.zero {
            grid-column: span 2;
        }

        /* --- 載入中介面 (轉圈圈) --- */
        #loading-view {
            display: none;
            flex-direction: column;
            height: 100%;
            justify-content: center;
            align-items: center;
            background: #fff;
            color: #555;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- 聊天室介面 --- */
        #chat-view {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #fff;
        }
        .chat-header {
            background: #3498db;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* ☢️ 圓形大圖示銷毀按鈕 */
        #destroy-btn {
            position: absolute;
            right: 15px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #ff4d4d;
            color: white;
            font-size: 26px;
            border: 2px solid #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s;
            padding: 0;
            line-height: 1;
        }
        #destroy-btn:active {
            transform: scale(0.9);
            background: #cc0000;
        }

        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #e5ddd5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 15px;
            word-wrap: break-word;
        }
        .msg.self {
            align-self: flex-end;
            background: #dcf8c6;
            border-bottom-right-radius: 4px;
        }
        .msg.other {
            align-self: flex-start;
            background: #fff;
            border-bottom-left-radius: 4px;
        }
        .chat-input {
            display: flex;
            padding: 12px;
            background: #f0f0f0;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }
        .chat-input button {
            background: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 0 18px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .chat-input button:active {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 計算機介面 -->
    <div id="calculator-view">
        <div id="calc-display">0</div>
        <div class="calc-buttons">
            <button class="calc-btn" onclick="clearCalc()">C</button>
            <button class="calc-btn" onclick="appendCalc('(')">(</button>
            <button class="calc-btn" onclick="appendCalc(')')">)</button>
            <button class="calc-btn op" onclick="appendCalc('/')">÷</button>
            
            <button class="calc-btn" onclick="appendCalc('7')">7</button>
            <button class="calc-btn" onclick="appendCalc('8')">8</button>
            <button class="calc-btn" onclick="appendCalc('9')">9</button>
            <button class="calc-btn op" onclick="appendCalc('*')">×</button>
            
            <button class="calc-btn" onclick="appendCalc('4')">4</button>
            <button class="calc-btn" onclick="appendCalc('5')">5</button>
            <button class="calc-btn" onclick="appendCalc('6')">6</button>
            <button class="calc-btn op" onclick="appendCalc('-')">−</button>
            
            <button class="calc-btn" onclick="appendCalc('1')">1</button>
            <button class="calc-btn" onclick="appendCalc('2')">2</button>
            <button class="calc-btn" onclick="appendCalc('3')">3</button>
            <button class="calc-btn op" onclick="appendCalc('+')">+</button>
            
            <button class="calc-btn zero" onclick="appendCalc('0')">0</button>
            <button class="calc-btn" onclick="appendCalc('.')">.</button>
            <button class="calc-btn op" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- 載入中介面 -->
    <div id="loading-view">
        <div class="spinner"></div>
        <p>加載中...</p>
    </div>

    <!-- 聊天室介面 -->
    <div id="chat-view">
        <div class="chat-header">
            秘密聊天室
            <!-- 無提示銷毀按鈕 -->
            <button id="destroy-btn" title="立即銷毀">☢️</button>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input">
            <input type="text" id="msg-input" placeholder="輸入訊息...">
            <button onclick="sendMessage()">傳送</button>
        </div>
    </div>
</div>

<script>
    /* --- 計算機邏輯 --- */
    let currentInput = "0";
    const display = document.getElementById('calc-display');

    function updateDisplay(val) {
        display.innerText = val;
    }

    function appendCalc(val) {
        if (currentInput === "0" && val !== ".") {
            currentInput = val;
        } else {
            currentInput += val;
        }
        updateDisplay(currentInput);
        checkSecretCode(currentInput);
    }

    function clearCalc() {
        currentInput = "0";
        updateDisplay(currentInput);
    }

    function calculate() {
        try {
            // 計算結果
            let result = eval(currentInput);
            
            // 檢查是否超過15位數 (轉換為字串後，去除小數點與負號，計算純數字長度)
            let numStr = result.toString();
            let digitCount = numStr.replace(/[^0-9]/g, '').length;
            
            if (digitCount > 15) {
                // 超過 15 位數，以科學記號表示（保留10位小數以防版面過長）
                result = result.toExponential(10);
            }
            
            currentInput = result.toString();
            updateDisplay(currentInput);
            checkSecretCode(currentInput);
        } catch (e) {
            currentInput = "Error";
            updateDisplay(currentInput);
            setTimeout(clearCalc, 1200);
        }
    }

    /* --- 解鎖與切換邏輯 --- */
    function checkSecretCode(val) {
        // 短碼改為 114514
        if (val === "114514") {
            enterSecretChat();
        }
    }

    function enterSecretChat() {
        // 隱藏計算機，顯示載入動畫
        document.getElementById('calculator-view').style.display = 'none';
        document.getElementById('loading-view').style.display = 'flex';
        
        // 模擬載入時間 (2秒後顯示聊天室)
        setTimeout(() => {
            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('chat-view').style.display = 'flex';
            loadMessages();
        }, 2000);
    }

    /* --- 聊天室邏輯 --- */
    const msgContainer = document.getElementById('chat-messages');
    const msgInput = document.getElementById('msg-input');

    function loadMessages() {
        msgContainer.innerHTML = '';
        let msgs = JSON.parse(localStorage.getItem('secret_msgs') || '[]');
        msgs.forEach(msg => {
            addMessageToDOM(msg.text, msg.type);
        });
        scrollToBottom();
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;

        addMessageToDOM(text, 'self');
        msgInput.value = '';
        scrollToBottom();

        // 寫入 LocalStorage
        let msgs = JSON.parse(localStorage.getItem('secret_msgs') || '[]');
        msgs.push({ text: text, type: 'self' });
        localStorage.setItem('secret_msgs', JSON.stringify(msgs));
    }

    function addMessageToDOM(text, type) {
        const div = document.createElement('div');
        div.classList.add('msg', type);
        div.innerText = text;
        msgContainer.appendChild(div);
    }

    function scrollToBottom() {
        msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    // 支援 Enter 發送
    msgInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    /* --- 銷毀邏輯 --- */
    document.getElementById('destroy-btn').addEventListener('click', function() {
        // 不需任何提示，直接清空數據與畫面
        localStorage.removeItem('secret_msgs'); 
        msgContainer.innerHTML = ''; 
        
        // 瞬間切換回計算機介面並重置
        document.getElementById('chat-view').style.display = 'none';
        document.getElementById('calculator-view').style.display = 'flex';
        clearCalc();
    });
</script>
</body>
</html>
